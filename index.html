<script>

async function startCamera(){

  try{

    stream = await navigator.mediaDevices.getUserMedia({
      video: true,
      audio: true
    });

    const video = document.getElementById("cam-vid");

    video.srcObject = stream;

    await video.play();

    document.getElementById("cam-pip").style.display = "block";

    return true;

  }catch(err){

    console.error(err);

    alert("Camera permission denied.");

    return false;
  }
}

async function reqFS(){

  const el = document.documentElement;

  if(el.requestFullscreen){
    await el.requestFullscreen();
  }
  else if(el.webkitRequestFullscreen){
    el.webkitRequestFullscreen();
  }
}

async function grantAndStart(){

  const btn = document.getElementById("start-btn");

  btn.disabled = true;

  btn.textContent = "Preparing Exam...";

  try{

    await reqFS();

    const camOK = await startCamera();

    if(!camOK){

      btn.disabled = false;

      btn.textContent = "🚀 Grant Permissions & Start Exam";

      return;
    }

    goto("s-exam");

    setTimeout(()=>{

      startExam();

    },100);

  }catch(err){

    console.error(err);

    alert("Failed to start exam.");

    btn.disabled = false;

    btn.textContent = "🚀 Grant Permissions & Start Exam";
  }
}

</script>
